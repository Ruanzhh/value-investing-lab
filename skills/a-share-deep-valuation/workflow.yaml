workflow:
  id: a-share-deep-valuation
  version: 3
  description: A 股单只股票深度分析→路由→经营情景→v3 估值买卖点（S5a/S4c/S5b）→独立复核→技术可达性与决策卡。支持 industry_branch=bank（见 references/bank-*.md）。主规则 valuation-rules-v3.md；旧 state 保留以兼容未完成 run。
  initial_state: intake

  artifacts:
    - id: valuation_request
      description: 用户给出的标的（代码/名称）、现价日期与任何指定约束。
      producer: external
      consumers: [intake]
      required_fields: [ticker, as_of_date]
      validation:
        - 标的可唯一识别（代码 + 交易所）。

    - id: source_index
      description: 证据事实源：已获取的原文/数据清单与数据缺口（data_gaps）。缺口不阻塞，只登记。
      producer: intake
      consumers: [deep_analysis, scenarios_risk, valuation_buy_sell, independent_review, ta_reachability_card]
      required_fields: [sources, price_snapshot, share_count, data_gaps]
      validation:
        - 每条来源有 ID、类型、URL/本地路径、页码或期间。
        - 每个 data_gap 有 item、影响的下游判断、保守处理方式（conservative_handling）。
        - 现价、日期、总股本有来源。

    - id: enterprise_analysis
      description: 企业深度分析事实源：模块 a–h、闸门 D1–D12 状态、老唐三前提裁定、好/坏机制与概率、开放问题。
      producer: deep_analysis
      consumers: [scenarios_risk, valuation_buy_sell, independent_review, ta_reachability_card]
      required_fields: [modules_a_to_h, gate_status_d1_d13, laotang_preconditions, good_cases, bad_cases, open_questions, thesis, break_codes, external_views]
      validation:
        - 每个闸门为 pass / pass_with_gap（引用 data_gap ID）/ fail，并附证据 ID。
        - 坏机制数量与量化深度 ≥ 好机制；各含机制、量化影响、触发、领先指标、主观概率、应对。
        - 老唐三前提逐条为 满足/部分/不满足 + 证据。

    - id: scenario_model
      description: 熊/基/牛经营驱动预测（量、价、单位利润、费用、资本开支、投资收益）及三年后净利 NI3 与依据。
      producer: scenarios_risk
      consumers: [valuation_buy_sell, independent_review, ta_reachability_card]
      required_fields: [drivers_by_scenario, ni3_by_scenario, base_neutrality_note, excess_net_cash, probabilities]
      validation:
        - 增长来自业务/市场/行业驱动；永续 g 只用于尾部（DCF 交叉检验）。
        - 基准不得夹带平台期/零增长，除非有证据并写明。
        - 超额净现金已扣经营性占款与必要营运现金，并注明来源。

    - id: risk_register
      description: 风险归属事实源：每个风险唯一归属 bear_scenario | hurdle_grade | position_rule | break_code。
      producer: scenarios_risk
      consumers: [valuation_buy_sell, independent_review, ta_reachability_card]
      required_fields: [risks]
      validation:
        - 每条风险恰有一个 owner，且该 owner 中可找到对应体现。
        - data_gap 引起的不确定性也登记一次。

    - id: valuation_decision
      description: 估值决策事实源：评级、退出 PE 来源、FV3、买点、卖点、仓位档、脆弱性、隐含回报（展示）、自检。
      producer: valuation_buy_sell
      consumers: [independent_review, ta_reachability_card]
      required_fields: [grade, hurdle, exit_pe, fv3_by_scenario, buy_point, laotang_reference, sell_point, position_band, fragility, implied_return_display, dcf_cross_check, self_check]
      validation:
        - 公式与参数完全按 references/valuation-rules-v3.md（V§4c/V§5b；材料不足则 B20_issued=false）。
        - self_check 写明：无 Ke 后再 hurdle；无重复扣减；基准 FV≈市价时有理由。

    - id: review_report
      description: 独立 subagent 复核报告（每轮追加）。
      producer: independent_review
      consumers: [ta_reachability_card]
      required_fields: [subagent_id, round, issues, verdict]
      validation:
        - subagent_id 非空且不是主 Agent；未参与前序产物生成。
        - 每条 issue 有 category、severity、evidence、route（deep_analysis | scenarios_risk | valuation_buy_sell）。

    - id: decision_card
      description: 最终交付：技术可达性 + 买卖点 + 分批计划 + 论点/击穿码 + 复查触发 + 数据缺口标注。是上述事实源的投影。
      producer: ta_reachability_card
      consumers: []
      required_fields: [ta_reachability, buy_sell, tranche_plan, thesis_and_breaks, recheck_triggers, flagged_gaps]
      validation:
        - 按 references/card-template.md；不得引入新估值事实。

  states:
    - id: intake
      name: 收集资料
      type: normal
      goal:
        text: 归一化标的并建立来源索引与数据缺口清单。
        refs: [references/artifact-contracts.md]
      inputs: [valuation_request]
      outputs: [source_index]
      actions:
        - id: collect_sources
          instruction: 获取年报（≥5 年，重资产 ≥10 年）、最近 4 份季报/半年报、重大公告/问询、业绩会与调研纪要、互动易、行业与竞品数据、价格与股本；取不到的项登记为 data_gap 并写保守处理方式。
          refs: [references/deep-analysis-gates.md]
          side_effect: readonly
      conditions:
        - id: sources_indexed
          check: source_index 满足 artifact validation；缺口已登记（缺口不导致失败）。
          failure:
            type: retry
            message: 来源索引不完整或缺口未登记。
            recovery: 补采或补登记 data_gap。
            resume_state: intake
        - id: ticker_resolvable
          check: 标的可唯一识别且有现价与股本。
          failure:
            type: blocked
            message: 无法识别标的或取不到现价/股本。
            recovery: 请用户确认代码或提供数据。
            resume_state: intake
      transitions:
        - to: routing
          when: [sources_indexed, ticker_resolvable]

    - id: routing
      name: 生意模式路由
      type: normal
      goal:
        text: 按利润驱动与 ROUTING.csv 定 business_model（主 1 + 副 ≤1）；改模式须 model_change_reason。
        refs: [references/v3/ROUTING.csv, references/v3/SKILL-master.md, references/valuation-rules-v3.md]
      inputs: [source_index]
      outputs: [source_index]
      actions:
        - id: route_business_model
          instruction: 查 references/v3/ROUTING.csv；写 business_model / method_by_model；与表不符须 model_change_reason；银行仍标 industry_branch=bank。
          refs: [references/v3/ROUTING.csv, references/v3/SKILL-master.md]
          side_effect: write
      conditions:
        - id: model_routed
          check: business_model 已写入且在 ROUTING/子流程表内，或有 model_change_reason。
          failure:
            type: retry
            message: 未路由或无改模式理由。
            recovery: 补路由或理由。
            resume_state: routing
      transitions:
        - to: deep_analysis
          when: [model_routed]

    - id: deep_analysis
      name: 企业深度分析
      type: gate
      goal:
        text: 完成模块 a–h 与闸门 D1–D13，好坏两面量化，老唐三前提裁定，并与外部高质量观点逐条对照。
        refs: [references/deep-analysis-gates.md, references/external-views.md]
      inputs: [source_index]
      outputs: [enterprise_analysis]
      actions:
        - id: analyze_modules
          instruction: 按模块 a–h 写出最低产出；好/坏各 ≥4 机制并给概率与应对；逐条裁定老唐三前提；列出论点、击穿码、开放问题。
          refs: [references/deep-analysis-gates.md, references/bank-gates.md]
          side_effect: write
        - id: compare_external_views
          instruction: 在自有分析初稿完成后，按 external-views.md 收集 3–5 位高质量作者对本公司的近期深度分析，拆论点/假设/最乐观/最担心，与自有结论逐条对照；分歧用一手数据裁决或登记为开放问题；写入 enterprise_analysis.external_views。观点不得作为数据源或直接改估值数字。
          refs: [references/external-views.md]
          side_effect: write
      conditions:
        - id: gates_met
          check: D1–D13 全部为 pass 或 pass_with_gap（gap 已在 source_index 登记且有保守处理）；坏面深度 ≥ 好面。
          refs: [references/deep-analysis-gates.md]
          failure:
            type: retry
            message: 存在未满足的深度闸门。
            recovery: 补齐对应模块后重评闸门。
            resume_state: deep_analysis
      transitions:
        - to: scenarios_risk
          when: [gates_met]

    - id: scenarios_risk
      name: 经营情景与风险归属
      type: normal
      goal:
        text: 建立熊/基/牛经营驱动预测与唯一归属的风险登记。
        refs: [references/risk-register.md]
      inputs: [source_index, enterprise_analysis]
      outputs: [scenario_model, risk_register]
      actions:
        - id: build_scenarios
          instruction: 由量、价/单位利润、费用、资本开支、投资收益推出三年 NI3；概率为主观判断并标注；计算超额净现金。
          refs: [references/valuation-rules-v3.md, references/bank-valuation-rules.md]
          side_effect: write
        - id: assign_risks
          instruction: 把 enterprise_analysis 的坏机制、开放问题与 data_gap 逐条分配唯一 owner。
          refs: [references/risk-register.md]
          side_effect: write
      conditions:
        - id: base_is_neutral
          check: 基准为中性经营预测，未夹带平台期/零增长；若低增长有证据则写明。
          refs: [references/valuation-rules-v3.md]
          failure:
            type: retry
            message: 基准情景偏置。
            recovery: 用业务驱动重建基准，悲观假设移入熊市。
            resume_state: scenarios_risk
        - id: risks_owned_once
          check: risk_register 每条风险恰一个 owner，且无风险被两处同时扣减。
          refs: [references/risk-register.md]
          failure:
            type: retry
            message: 风险重复计入或无归属。
            recovery: 调整归属并同步修改情景。
            resume_state: scenarios_risk
      transitions:
        - to: valuation_buy_sell
          when: [base_is_neutral, risks_owned_once]

    - id: valuation_buy_sell
      name: 估值与买卖点
      type: gate
      goal:
        text: 按 v2.5 规则得出评级、买点、卖点、仓位档与脆弱性。
        refs: [references/valuation-rules-v3.md]
      inputs: [source_index, enterprise_analysis, scenario_model, risk_register]
      outputs: [valuation_decision]
      actions:
        - id: compute_valuation
          instruction: 按子流程交 FV3；S5a 算内部 B20（FY3_yearend、n=实际年数）；S4c 外部交叉校验（不可抬 B20）；S5b 签发或 B20_issued=false；双方法/区间买入硬闸；DCF/外部 FV 仅交叉；概率只展示。材料不足不发明 NI3/PE。
          refs: [references/valuation-rules-v3.md, references/v3/SKILL-master.md, references/bank-valuation-rules.md]
          side_effect: write
      conditions:
        - id: self_check_passed
          check: 无 Ke-then-hurdle 叠加；无重复扣减；双方法或 dual_method_exception；外部永不抬 B20；B20_issued 与 gate_block_reason 一致；基准 FV≈市价（±15%）时有书面理由；V20_LIVE_INHERIT 已标注。
          refs: [references/valuation-rules-v3.md, references/risk-register.md]
          failure:
            type: retry
            message: 估值自检未通过。
            recovery: 修正计算或补理由。
            resume_state: valuation_buy_sell
      transitions:
        - to: independent_review
          when: [self_check_passed]

    - id: independent_review
      name: 独立复核
      type: review
      goal:
        text: 由独立 subagent 挑战假设偏置、双重保守、数据来源与深度闸门。
        refs: [references/artifact-contracts.md]
      inputs: [source_index, enterprise_analysis, scenario_model, risk_register, valuation_decision]
      outputs: [review_report]
      actions:
        - id: run_independent_reviewer
          instruction: 启动未参与前序工作的独立 subagent，只给产物与规则 references，不给主 Agent 推理过程；只报告，不修改产物；记录 subagent_id 与 round。
          refs: [references/valuation-rules-v3.md, references/bank-valuation-rules.md, references/risk-register.md, references/deep-analysis-gates.md, references/bank-gates.md, references/external-views.md]
          side_effect: readonly
      conditions:
        - id: reviewer_independent
          check: review_report 来自独立 subagent（subagent_id 存在且非主 Agent）。不可用时不得由主 Agent 代审。
          failure:
            type: blocked
            message: 独立 reviewer 不可用。
            recovery: 待 subagent 可用后重跑复核。
            resume_state: independent_review
        - id: round_within_limit
          check: 本轮 round ≤ 3。
          failure:
            type: blocked
            message: 复核已 3 轮仍未收敛。
            recovery: 把未决 issue 交用户裁决后恢复。
            resume_state: independent_review
        - id: no_analysis_issues
          check: 无 route=deep_analysis 的 high/medium issue（数据来源、闸门）。
          failure:
            type: transition
            message: 深度分析或来源存在问题。
            recovery: 回到 deep_analysis 修正后重走下游。
            to: deep_analysis
            resume_state: independent_review
        - id: no_scenario_issues
          check: 无 route=scenarios_risk 的 high/medium issue（假设偏置、风险重复）。
          failure:
            type: transition
            message: 情景或风险归属存在问题。
            recovery: 回到 scenarios_risk 修正。
            to: scenarios_risk
            resume_state: independent_review
        - id: no_valuation_issues
          check: 无 route=valuation_buy_sell 的 high/medium issue（双重保守、公式、参数）。
          failure:
            type: transition
            message: 估值计算存在问题。
            recovery: 回到 valuation_buy_sell 修正。
            to: valuation_buy_sell
            resume_state: independent_review
      transitions:
        - to: ta_reachability_card
          when: [reviewer_independent, round_within_limit, no_analysis_issues, no_scenario_issues, no_valuation_issues]

    - id: ta_reachability_card
      name: 技术可达性与决策卡
      type: terminal
      goal:
        text: 评估买点技术可达性并输出最终决策卡。
        refs: [references/card-template.md]
      inputs: [source_index, enterprise_analysis, scenario_model, risk_register, valuation_decision, review_report]
      outputs: [decision_card]
      actions:
        - id: assess_reachability
          instruction: 计算距离、支撑阶梯、周线趋势与可达性等级；仅在可达性低且仍靠近熊市带时上调首批触发价。
          refs: [references/ta-reachability.md]
          side_effect: write
        - id: write_card
          instruction: 按模板生成决策卡，标注所有 data_gap 及保守处理。
          refs: [references/card-template.md]
          side_effect: write
      conditions:
        - id: card_consistent
          check: 卡片数字与 valuation_decision 一致；技术面未把买点抬到估值区间之上；缺口已标注。
          refs: [references/ta-reachability.md, references/card-template.md]
          failure:
            type: retry
            message: 决策卡与事实源不一致或违反技术面边界。
            recovery: 按事实源重写卡片。
            resume_state: ta_reachability_card
      transitions: []
